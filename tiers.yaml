# tiers.yaml — TickFlow 档位能力声明（本地兜底版）
# 说明：原仓库此文件由 CI 构建时生成，这里依据 backend/app/tickflow/capabilities.py
# 的 Cap 枚举手工重建最小可用版本，使「无 Key 的免费模式」可正常启动并拉取历史日 K。
# 结构: { 档位: { 能力名: {rpm, batch, subscribe} } }，limit 仅用于 UI 显示与本地限速，
# 真实上限由 TickFlow 服务端控制。付费档位在有 Key 时由探针结果覆盖。

